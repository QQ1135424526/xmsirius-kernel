name: Build xmsirius kernel (KernelSU upgrade)

# 用途：在 GitHub 云端编译 MI 8 SE (xmsirius) 的内核，并把 KernelSU 升级到指定版本。
# 产物：Image.gz-dtb（内核 + appended DTB），供后续用 magiskboot 塞回 boot.img。
#
# 用法：Actions → 选本 workflow → Run workflow → 填参数 → 运行。

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支（Rocky7842/android_kernel_xiaomi_sdm710）'
        required: true
        default: 'lineage-23.2-ksu'
      ksu_ref:
        description: 'rsuntk/KernelSU 的 tag 或 commit（留空 = main 最新）'
        required: false
        default: 'v3.2.2-10-legacy'
      clang_ver:
        description: 'ZyCromerZ Clang 版本（形如 16.0.6-20260807）'
        required: true
        default: '16.0.6-20260807'
      jobs:
        description: '并行编译任务数（4 = runner 核数）'
        required: true
        default: '4'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: '0. 环境与磁盘'
        run: |
          echo "== CPU / 内存 =="; nproc; free -h
          echo "== 磁盘（清理前）=="; df -h /

      - name: '1. 清理 runner 磁盘（腾出空间）'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          sudo apt-get clean
          echo "== 磁盘（清理后）=="; df -h /

      - name: '2. 安装构建依赖'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush python3 python-is-python3 rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev

      - name: '3. 克隆内核源码'
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            https://github.com/Rocky7842/android_kernel_xiaomi_sdm710 kernel
          cd kernel
          echo "== 内核版本 =="
          head -5 Makefile
          echo "== HEAD =="
          git log --oneline -1
          echo "== KSU 配置（升级前）=="
          grep -n -iE 'KSU' arch/arm64/configs/xiaomi/sdm710-common.config || true

      - name: '4. 升级 KernelSU（替换 drivers/kernelsu）'
        run: |
          cd kernel
          echo "== 旧版文件数 =="
          ls drivers/kernelsu | wc -l
          # 先挪走备份，万一新版装不上可以回退（仓库自带的 vendored 版本是能编译的）
          mv drivers/kernelsu /tmp/ksu_orig

          # 注意：留空 = 跳过替换（真·基线构建）。
          # 早先的写法是「留空就 clone main」，那其实仍然是替换，永远拿不到基线。
          if [ -z "${{ inputs.ksu_ref }}" ] || [ "${{ inputs.ksu_ref }}" = "none" ]; then
            echo "ksu_ref 为空/none ⇒ 跳过 KSU 替换，使用仓库自带版本（基线构建）"
            mv /tmp/ksu_orig drivers/kernelsu
            echo "KSU_UPGRADED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          git clone --depth=1 -b "${{ inputs.ksu_ref }}" \
            https://github.com/rsuntk/KernelSU /tmp/ksu
          echo "== rsuntk/KernelSU HEAD =="
          git -C /tmp/ksu log --oneline -1

          # 关键：rsuntk 新版里 kernel/include/uapi 是【符号链接】，指向 kernel/ 目录之外。
          # 只用 cp -r 会让链接悬空，编译时报：
          #   drivers/kernelsu/ksu.c:4:10: fatal error: 'include/uapi/app_profile.h' file not found
          # 必须用 cp -rL 解引用，把 uapi 实体化。
          cp -rL /tmp/ksu/kernel drivers/kernelsu

          echo "== 新版头文件完整性校验 =="
          if [ -f drivers/kernelsu/include/uapi/app_profile.h ]; then
            echo "  OK app_profile.h 存在"
          else
            echo "  !! 新版 KSU 头文件不全，回退到仓库自带版本"
            rm -rf drivers/kernelsu
            mv /tmp/ksu_orig drivers/kernelsu
            echo "  KSU_UPGRADED=no" >> "$GITHUB_ENV"
          fi
          [ -d /tmp/ksu_orig ] && echo "  KSU_UPGRADED=yes" >> "$GITHUB_ENV"

          echo "== 新版文件数 =="
          ls drivers/kernelsu | wc -l
          ls drivers/kernelsu
          echo "== 接线检查（必须各有一行）=="
          grep -n 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -n 'kernelsu/' drivers/Makefile
          echo "== 新版 Kconfig 里的配置名 =="
          grep -nE '^\s*(config|bool|tristate)' drivers/kernelsu/Kconfig | head -30

      - name: '4b. 修补 hooks.c（新版 KernelSU 已移除 is_ksu_transition）'
        run: |
          cd kernel
          python3 - <<'PY'
          import re, sys
          p = 'security/selinux/hooks.c'
          s = open(p, encoding='utf-8', errors='replace').read()
          pat = re.compile(
              r'#ifdef CONFIG_KSU\n'
              r'extern bool is_ksu_transition\(const struct task_security_struct \*old_tsec,\n'
              r'\s*const struct task_security_struct \*new_tsec\);\n'
              r'#endif\n'
          )
          repl = (
              '#ifdef CONFIG_KSU\n'
              '/* patched by CI: 新版 KernelSU 已移除 is_ksu_transition()。\n'
              ' * 新 KSU 改为运行时注入 SELinux 策略来放行 su 域转换，不再需要该钩子。\n'
              ' * 这里补一个 static 桩，满足内核树自带的调用点（check_nnp_nosuid）。 */\n'
              'static bool is_ksu_transition(const struct task_security_struct *old_tsec __maybe_unused,\n'
              '                              const struct task_security_struct *new_tsec __maybe_unused)\n'
              '{\n'
              '\treturn false;\n'
              '}\n'
              '#endif\n'
          )
          s2, n = pat.subn(repl, s)
          if n != 1:
              print('!! hooks.c 补丁未命中（替换 %d 处），需要人工核对' % n)
              sys.exit(1)
          open(p, 'w', encoding='utf-8').write(s2)
          print('hooks.c 补丁完成，替换 1 处')
          PY
          echo "== 校验补丁结果 =="
          grep -n -A7 'static bool is_ksu_transition' security/selinux/hooks.c

      - name: '4c. 对齐 KSU_VERSION（消除管理器「版本不匹配」提示）'
        run: |
          cd kernel
          MF=drivers/kernelsu/Makefile
          if [ ! -f "$MF" ]; then
            echo "!! 找不到 $MF（新版 KSU 结构可能不同）"
            grep -rn 'KSU_VERSION' drivers/kernelsu/ 2>/dev/null | head -5
            exit 1
          fi
          echo "== 改前 =="
          grep -n 'KSU_VERSION' "$MF"
          # 管理器装的是官方 v3.2.3 (versionCode 32455)，让内核侧对齐即可消除提示
          sed -i 's/-DKSU_VERSION=[0-9]\+/-DKSU_VERSION=32455/' "$MF"
          echo "== 改后 =="
          grep -n 'KSU_VERSION' "$MF"
          grep -q 'KSU_VERSION=32455' "$MF" || { echo "!! 替换失败"; exit 1; }

      - name: '5. 下载 clang 工具链'
        run: |
          mkdir -p tc && cd tc

          # clang 选型说明：
          #   ZyCromerZ 的 clang 虽然常见，但它是「裁掉集成汇编器」的定制构建 ——
          #   编译 .s 时会调外部 as（GCC 4.9 的 binutils 2.24），而 clang 16 生成的
          #   DWARF-5 风格 .file 指令它不认，vDSO 必然失败，且 -integrated-as 无效。
          #   因此优先用带完整集成汇编器的 Android 官方系 clang。
          AOSP_BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive"
          CANDIDATES="
          https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6778096/archive/refs/heads/10.0.tar.gz|crDroid clang-6778096
          $AOSP_BASE/refs/heads/main/clang-r563880c.tar.gz|AOSP clang-r563880c
          $AOSP_BASE/refs/heads/master/clang-r563880c.tar.gz|AOSP clang-r563880c(master)
          https://github.com/ZyCromerZ/Clang/releases/download/${{ inputs.clang_ver }}-release/Clang-${{ inputs.clang_ver }}.tar.gz|ZyCromerZ ${{ inputs.clang_ver }}
          "

          GOT=""
          for entry in $CANDIDATES; do
            u="${entry%%|*}"
            nm="${entry##*|}"
            [ -z "$u" ] && continue
            echo "尝试: $nm"
            echo "  $u"
            code=$(curl -sL -o clang.tar.gz -w '%{http_code}' --retry 1 --max-time 900 "$u" || echo 000)
            sz=$(stat -c %s clang.tar.gz 2>/dev/null || echo 0)
            echo "  HTTP $code  大小 $sz"
            if [ "$code" = "200" ] && [ "$sz" -gt 1000000 ]; then GOT="$nm"; break; fi
          done
          if [ -z "$GOT" ]; then echo "!! 所有 clang 源都下载失败"; exit 1; fi
          echo "使用: $GOT"
          echo "CLANG_SRC=$GOT" >> "$GITHUB_ENV"
          ls -lh clang.tar.gz

          mkdir -p clang
          tar -xzf clang.tar.gz -C clang --strip-components=0 2>/dev/null || tar -xzf clang.tar.gz -C clang
          echo "== 解压后顶层 =="
          ls clang | head

          # 兼容「tarball 里多套了一层目录」
          if [ ! -x clang/bin/clang ]; then
            INNER="$(dirname "$(dirname "$(find clang -maxdepth 4 -type f -name clang | head -1)")")"
            if [ -n "$INNER" ] && [ "$INNER" != "clang" ]; then
              echo "检测到嵌套目录: $INNER"
              mv "$INNER" clang2 && rm -rf clang && mv clang2 clang
            fi
          fi

          echo "== clang 版本 =="
          ./clang/bin/clang --version || true

          # 关键校验：必须自带集成汇编器，否则 vDSO 又会挂
          echo "== 集成汇编器能力检测 =="
          printf '.text\n' > /tmp/probe.s
          if ./clang/bin/clang -c -x assembler /tmp/probe.s -o /tmp/probe.o >/dev/null 2>&1; then
            echo "  OK 可以汇编（未调用外部 as）"
            ./clang/bin/clang -### -c -x assembler /tmp/probe.s -o /tmp/probe.o 2>&1 | grep -c 'integrated-as' | sed 's/^/  integrated-as 出现次数: /'
          else
            echo "  !! 无法汇编，可能仍走外部 as"
            ./clang/bin/clang -### -c -x assembler /tmp/probe.s -o /tmp/probe.o 2>&1 | tail -5
          fi

          echo "TC=$PWD/clang" >> "$GITHUB_ENV"

      - name: '6. 下载 GCC 工具链（32/64 位）'
        run: |
          cd tc
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          echo "GCC64=$PWD/gcc64" >> "$GITHUB_ENV"
          echo "GCC32=$PWD/gcc32" >> "$GITHUB_ENV"

      - name: '6b. 用新版 binutils 顶替 GCC 4.9 的 as'
        run: |
          # 背景：ZyCromerZ 的 clang 走外部汇编器，而内核按 CROSS_COMPILE 找到的是
          # GCC 4.9 自带的 aarch64-linux-android-as（binutils 2.24）。clang 16 生成的
          # 汇编是 DWARF-5 风格（.file 1 "x.c"），binutils 2.24 只认 DWARF-4 的
          # .file "x.c"，于是报：
          #   /tmp/vgettimeofday-*.s:3: Error: junk at end of line, first unrecognized
          #   character is `"'  /  Error: file number less than one
          # 解决：用 Ubuntu 的新版 aarch64 binutils 顶替，并软链成 android 前缀。
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          mkdir -p tc/bin
          for t in as ld objdump ar nm strip objcopy readelf ranlib; do
            if [ -x "/usr/bin/aarch64-linux-gnu-$t" ]; then
              ln -sf "/usr/bin/aarch64-linux-gnu-$t" "tc/bin/aarch64-linux-android-$t"
            fi
          done
          echo "== 新版 binutils 版本 =="
          aarch64-linux-gnu-as --version | head -1
          echo "== 软链结果 =="
          ls -l tc/bin/ | head
          echo "== 确认软链生效 =="
          ./tc/bin/aarch64-linux-android-as --version | head -1
          echo "NEWBIN=$PWD/tc/bin" >> "$GITHUB_ENV"

      - name: '7. 生成 .config（合并 fragment）'
        run: |
          cd kernel
          export ARCH=arm64 SUBARCH=arm64
          mkdir -p out

          make O=out ARCH=arm64 vendor/sdm670-perf_defconfig

          # sdm710-common.config 里带着 CONFIG_KSU=y / CONFIG_KSU_MANUAL_HOOK=y
          ./scripts/kconfig/merge_config.sh -O out out/.config \
            arch/arm64/configs/xiaomi/sdm710-common.config \
            arch/arm64/configs/xiaomi/sirius.config

          make O=out ARCH=arm64 olddefconfig

          echo "== 关键配置确认 =="
          grep -E 'CONFIG_KSU|CONFIG_MACH_XIAOMI_SIRIUS|CONFIG_ARCH_SDM670|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES' out/.config || true

      - name: '8. 编译内核'
        run: |
          cd kernel
          export ARCH=arm64 SUBARCH=arm64

          # 关键：三个工具链的 bin 都必须进 PATH
          #   - clang       提供 CC / ld.lld / llvm-*
          #   - gcc64       提供内核按 CROSS_COMPILE 推导出的 aarch64-linux-android-{objdump,ld,ar,...}
          #   - gcc32       提供 32 位兼容（vdso32 / COMPAT）所需的 arm-linux-androideabi-*
          # 漏掉 gcc64/gcc32 会报 "aarch64-linux-android-objdump: not found"，
          # 并进一步导致 vDSO 构建失败、vdso-offsets.h 不完整、signal.c 报
          # "use of undeclared identifier 'vdso_offset_sigtramp'"。
          # NEWBIN 必须排在最前：它里面是把新版 binutils 软链成 aarch64-linux-android-*
          # 用来顶替 GCC 4.9 的 binutils 2.24（不认 clang 的 DWARF-5 .file 指令）
          export PATH="$NEWBIN:$TC/bin:$GCC64/bin:$GCC32/bin:$PATH"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "== 工具链自检 =="
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip \
                   aarch64-linux-android-as aarch64-linux-android-objdump aarch64-linux-android-ld \
                   aarch64-linux-android-ar arm-linux-androideabi-objdump arm-linux-androideabi-ld; do
            p="$(command -v $t 2>/dev/null)"
            if [ -n "$p" ]; then echo "  OK   $t -> $p"; else echo "  MISS $t"; fi
          done
          echo "== 实际用的 as 版本（应为 2.3x，不是 2.24）=="
          aarch64-linux-android-as --version | head -1

          # CC 必须带 -integrated-as：
          #   内核 vDSO 的规则是 cmd_vdsocc = ${CC} $(c_flags) -c -o $@ $<
          #   （用的是 $(CC)，所以覆盖 AS= 没用）。ZyCromerZ 的 clang 是为内核定制的，
          #   默认走外部汇编器 as —— 而 as 来自 GCC 4.9 的 binutils 2.24，不认识 clang 16
          #   生成的汇编，报 "junk at end of line, first unrecognized character is `\"'"，
          #   导致 vDSO 构建失败 → vdso-offsets.h 不完整 → signal.c 报
          #   "use of undeclared identifier 'vdso_offset_sigtramp'"。
          #   -integrated-as 强制走 clang 自带汇编器，问题消失。
          set +e
          make -j"${{ inputs.jobs }}" O=out ARCH=arm64 \
            CC="clang -integrated-as" \
            KCFLAGS="-gdwarf-4" \
            AS=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image.gz-dtb > /tmp/build.log 2>&1
          RC=$?
          echo "== make 退出码 $RC =="
          echo "== 日志行数: $(wc -l < /tmp/build.log) =="
          echo "== 日志开头 40 行（看是否一启动就失败）=="
          head -40 /tmp/build.log
          echo "== 日志最后 150 行 =="
          tail -150 /tmp/build.log
          if [ "$RC" -ne 0 ]; then
            echo "== 关键错误行 =="
            grep -nE 'error:|Error [0-9]|fatal error|No rule to make|make(\[[0-9]+\])?: \*\*\*|undefined reference|LLVM ERROR|No space left' /tmp/build.log | head -30
          fi
          exit $RC

      - name: '8b. 上传完整编译日志'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: '9. 收集产物'
        run: |
          cd kernel
          # ⚠️ 编译用了 O=out，产物在 out/arch/arm64/boot/，
          #    不是 arch/arm64/boot/（那里只有源码：Makefile / dts / install.sh）。
          #    早先写成 arch/arm64/boot/ 导致「编译成功但产物清单为空」。
          echo "== out/arch/arm64/boot/ 内容 =="
          ls -lh out/arch/arm64/boot/ | head -30
          mkdir -p /tmp/out
          for f in Image Image.gz Image.gz-dtb Image-dtb; do
            if [ -f "out/arch/arm64/boot/$f" ]; then
              cp "out/arch/arm64/boot/$f" /tmp/out/
              echo "已收集 $f"
            fi
          done
          [ -f out/System.map ] && cp out/System.map /tmp/out/ && echo "已收集 System.map"
          echo "== 产物清单 =="
          ls -lh /tmp/out/
          # 必须至少有一个内核镜像，否则直接失败（别让「空产物」被当成成功）
          if [ ! -f /tmp/out/Image ] && [ ! -f /tmp/out/Image.gz-dtb ]; then
            echo "!! 没有收集到任何内核镜像，构建视为失败"
            exit 1
          fi

      - name: '10. 上传产物'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.ksu_ref || 'main' }}
          path: /tmp/out/
          retention-days: 14
          if-no-files-found: error
